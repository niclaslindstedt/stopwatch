<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a thick ring with its middle cut out, and the crown a
       stopwatch is started with standing on top of it. Flat green on the dark
       install surface — the same treatment as the sibling apps, so they read
       as one family on a home screen. Flat means flat: one ink, no gradient,
       no bevel.

       Geometry, in the 100 viewBox: a circle of radius 27 centred at
       (50, 54) stroked at 20, so the ring runs from radius 17 out to 37, and
       a crown from (42, 5) to (58, 18) with corners rounded by 3. The same
       numbers are rasterised into the PNG install icons, the favicon and the
       social card by scripts/generate-icons.mjs (`npm run icons`) and
       mirrored in src/app/icons.tsx and the dial's printing in
       src/app/Dial.tsx — they are kept in step by hand. -->
  <rect width="100" height="100" rx="20" fill="#12101a" />
  <circle cx="50" cy="54" r="27" fill="none" stroke="#3ef07f" stroke-width="20" />
  <rect x="42" y="5" width="16" height="13" rx="3" fill="#3ef07f" />
</svg>

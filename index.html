<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Stopwatch — stopwatches and timers</title>
    <meta
      name="description"
      content="Stopwatch is a local-first stopwatch and timer PWA on a chronograph watch face. Press the dial to start, run several at once, name them, and set timers in hours and minutes. Everything stays on your device, and syncs to your own cloud only if you connect one."
    />
    <!-- Not meant to be found: people find the App Store page and
         apps.agilator.se, not this web edition. -->
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stopwatch" />
    <meta
      property="og:description"
      content="Local-first stopwatches and timers on a chronograph watch face: run several at once, name them, count down from hours and minutes. No account, no server."
    />
    <meta property="og:url" content="https://stopwatch.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://stopwatch.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stopwatch" />
    <meta
      name="twitter:description"
      content="Local-first stopwatches and timers on a chronograph watch face: run several at once, name them, count down from hours and minutes. No account, no server."
    />
    <meta
      name="twitter:image"
      content="https://stopwatch.niclaslindstedt.se/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
